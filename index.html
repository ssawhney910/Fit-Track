<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overload Log</title>
<meta name="theme-color" content="#1B4FD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow logbook column, bottom tab bar. Colour semantics borrow IPF plate colours:
   green = add weight, blue = add reps, grey = hold, red = deload, yellow = personal record. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E3E8ED; --ink:#0E1B26; --muted:#58697A; --line:#CBD3DB;
  --accent:#1B4FD6; --on-accent:#FFFFFF; --up:#1C8548; --pr:#E3AA00; --pr-ink:#2A2000; --down:#C62F29; --hold:#6A7B8B;
  --hero-bg:#0E1B26; --hero-fg:#EDF0F3; --hero-mute:#9FB0BF; --hero-line:#26394A;
  --f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C131A; --surface:#141E27; --surface2:#1D2A36; --ink:#E9EEF2; --muted:#8EA0AF; --line:#27343F;
    --accent:#6C97FF; --on-accent:#0C131A; --up:#4CC17C; --pr:#F2C230; --pr-ink:#2A2000; --down:#F0605A; --hold:#8497A8;
    --hero-bg:#1B2A38; --hero-fg:#EDF2F6; --hero-mute:#93A6B6; --hero-line:#2C4153;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131A; --surface:#141E27; --surface2:#1D2A36; --ink:#E9EEF2; --muted:#8EA0AF; --line:#27343F;
  --accent:#6C97FF; --on-accent:#0C131A; --up:#4CC17C; --pr:#F2C230; --pr-ink:#2A2000; --down:#F0605A; --hold:#8497A8;
  --hero-bg:#1B2A38; --hero-fg:#EDF2F6; --hero-mute:#93A6B6; --hero-line:#2C4153;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 var(--f-body);
  padding-block:6px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:800;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;line-height:1.05}
h2{font-size:26px} h3{font-size:21px}
small,.sm-t{font-size:12.5px;color:var(--muted)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font:800 27px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em}
.status{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.2}
.ico{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topr{display:flex;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;letter-spacing:.01em}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--down);border:1px solid var(--down)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec h2{font-size:22px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stat{padding:14px 14px 12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font:800 34px/1 var(--f-disp);margin-top:4px;font-variant-numeric:tabular-nums}
.stat small{display:block}

.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:16px;padding:18px 16px 16px}
.hero .lbl{color:var(--hero-mute)}
.hero h2{font-size:36px;margin:6px 0 12px}
.hero ul{list-style:none;margin:0 0 16px;padding:0}
.hero li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--hero-line);font-size:14.5px}
.hero li>span:first-child{min-width:0;overflow-wrap:anywhere}
.hero li .t{font-family:var(--f-mono);font-size:12.5px;color:var(--hero-mute);white-space:nowrap;display:flex;gap:7px;align-items:center;flex:none}
.hero .btn{background:var(--hero-fg);color:var(--hero-bg)}

.plate{--k:var(--hold);width:14px;height:14px;border-radius:50%;flex:none;display:inline-block;background:radial-gradient(circle at center,var(--surface) 0 2.4px,var(--k) 3px)}
.hero .plate{background:radial-gradient(circle at center,var(--hero-bg) 0 2.4px,var(--k) 3px)}
.k-up{--k:var(--up)} .k-rep{--k:var(--accent)} .k-hold{--k:var(--hold)} .k-deload{--k:var(--down)} .k-new{--k:var(--pr)} .k-plan{--k:var(--ink)}
.hero .k-plan{--k:var(--hero-fg)}

.list{display:grid}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li>div{min-width:0}
.li b{display:block;overflow-wrap:anywhere}
.dy{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:30px;flex:none}
.donechip{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:700;color:var(--up)}

.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.wl{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.wl .big{font-size:20px;font-weight:500}
.wname{min-width:0;width:100%;border:0;background:transparent;font:800 22px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;padding:6px 0;color:var(--ink)}
.wr{display:flex;gap:8px;align-items:center;flex:none}
.rest{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--f-mono)}
.rest.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.xc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin-bottom:12px}
.xh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px 10px}
.xh h3{overflow-wrap:anywhere;min-width:0}
.xh small{text-align:right}
.sug{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sug .plate{margin-top:3px}
.sug .st{display:grid;gap:2px;min-width:0}
.sug b{font-size:14px}
.sug small{line-height:1.35}
.sug .stall{color:var(--down);font-weight:600}
.pnote{display:block;font-size:12.5px;color:var(--muted);padding:0 4px 10px;line-height:1.35}
.sets{display:grid;gap:6px}
.row,.rowh{display:grid;grid-template-columns:34px minmax(52px,.9fr) 1fr 1fr 44px;gap:6px;align-items:center}
.rowh{padding:0 0 2px}
.rowh span{font-size:10.5px;letter-spacing:.09em;color:var(--muted);text-align:center;font-weight:600}
.row{border-radius:10px;padding:2px 0}
.row.done{background:color-mix(in srgb,var(--up) 15%,var(--surface))}
.sn{height:40px;border:0;border-radius:8px;background:var(--surface2);font:500 14px var(--f-mono);color:var(--muted)}
.sn.wu{background:color-mix(in srgb,var(--pr) 35%,var(--surface));color:var(--ink);font-weight:600}
.prev{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.num{width:100%;min-width:0;height:44px;border-radius:8px;border:1px solid transparent;background:var(--surface2);text-align:center;font:500 17px var(--f-mono);color:var(--ink)}
.num.sm{height:38px;font-size:15px}
.num:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.nw{height:44px;display:grid;place-items:center;color:var(--muted);font:500 15px var(--f-mono)}
.chk{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:22px;height:22px;fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row.done .chk{background:var(--up);border-color:var(--up)}
.row.done .chk svg{stroke:#fff}
.xa{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.xa .btn{flex:1;min-width:84px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{position:relative;display:grid;justify-items:center;gap:3px;padding:7px 2px 6px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.live{position:absolute;top:6px;right:calc(50% - 19px);width:8px;height:8px;border-radius:50%;background:var(--down)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:13px;font-weight:600;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chartbox{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chval{min-height:22px;font-size:13px;margin-bottom:4px}
.chval b{font-weight:600}
.ax{fill:var(--muted);font:10px var(--f-mono)}
.grid{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.dot.pr{fill:var(--pr);stroke:var(--pr)}
.dot.last{fill:var(--accent)}
.hi{fill:none;stroke:var(--ink);stroke-width:1.5}
.bar{fill:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.bar.cur{fill:var(--accent)}

/* muscle dashboard */
.mx{display:grid;grid-template-columns:minmax(66px,1.6fr) repeat(7,1fr) 30px;gap:3px;align-items:center}
.mx .h{font:600 10.5px var(--f-body);color:var(--muted);text-align:center;letter-spacing:.06em}
.mx .h.today{color:var(--accent);font-weight:700}
.mx .ml{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .gl{grid-column:1/-1;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px}
.mx .tot{text-align:right;font:500 12px var(--f-mono)}
.cell{height:26px;border-radius:5px;display:grid;place-items:center;font:500 12px var(--f-mono);background:color-mix(in srgb,var(--accent) calc(var(--v) * 1%),var(--surface2));color:var(--ink)}
.cell.hot{color:var(--on-accent)}
.cell.z{background:var(--surface2);color:transparent}
.mc{border-top:1px solid var(--line)}
.mc:first-child{border-top:0}
.mc summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;gap:8px}
.mc summary::-webkit-details-marker{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh b{font-size:15px}
.st2{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.mtrack{position:relative;height:9px;background:var(--surface2);border-radius:5px}
.mfill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.mfill.lite{background:color-mix(in srgb,var(--accent) 35%,var(--surface2))}
.mtick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.mm{font-size:12.5px;color:var(--muted)}
.mbody{padding:0 16px 16px;display:grid;gap:12px}
.alt{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.alt:first-of-type{border-top:0}
.alt span{color:var(--muted)}
.wk{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0}
.wk span:last-child{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}

.field{display:grid;gap:6px}
.field input[type=text],.field select,.inp{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%;min-width:0}
.inline{display:flex;gap:10px}
.inline>*{min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pr);color:var(--pr-ink)}
.note{font-size:13px;color:var(--muted)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px dashed var(--hold);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.empty{text-align:center;padding:26px 18px}
.empty h3{margin-bottom:8px}
details.how summary{cursor:pointer;font-weight:600;padding:4px 0}
details.how p,details.how li{font-size:13.5px;color:var(--muted)}
details.sess summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:13px 16px;align-items:center}
details.sess summary::-webkit-details-marker{display:none}
details.sess{border-top:1px solid var(--line)}
details.sess:first-child{border-top:0}
.sbody{padding:0 16px 14px;display:grid;gap:10px}
.sx b{font-size:14px}
.sx div{font:12.5px/1.6 var(--f-mono);color:var(--muted)}
.sx .w{opacity:.65}

.scrim{position:fixed;inset:0;background:rgba(6,12,18,.55);z-index:40}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:88dvh;overflow:auto;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border:1px solid var(--line);border-bottom:0}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk{display:grid}
.pk button{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:12px 4px;border:0;border-top:1px solid var(--line);background:transparent;align-items:center}
.pk button:first-child{border-top:0}
.pk small{text-align:right}
.er{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.er:first-child{border-top:0}
.ef{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
.ef label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.ef select{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px}
.rr{display:flex;gap:6px;align-items:center}
.rr .num{width:56px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.pr-list{display:grid;gap:8px;margin:12px 0}
.pr-list div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sumgrid b{display:block;font:800 30px/1 var(--f-disp)}
/* dashboard overview */
.dash-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.dl{font-size:12px;color:var(--muted)} .dl.up{color:var(--up);font-weight:600}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodies figure{margin:0;text-align:center}
.bodies figcaption{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bodies svg{width:100%;max-width:190px;height:auto;display:block;margin:0 auto}
.bb{fill:var(--surface2);stroke:none}
.bm.fn{fill:color-mix(in srgb,var(--hold) 22%,var(--surface2))}
.sw.fn{background:color-mix(in srgb,var(--hold) 22%,var(--surface2))}
.lnk{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;padding:4px 0;cursor:pointer}
.bm{stroke:var(--surface);stroke-width:1.2;cursor:pointer;outline:none}
.bm:focus-visible{stroke:var(--ink);stroke-width:2.5}
.bm.f0{fill:color-mix(in srgb,var(--up) 62%,var(--surface2))}
.bm.f1{fill:var(--pr)}
.bm.f2{fill:var(--down)}
.bm.sel{stroke:var(--ink);stroke-width:2.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.f0{background:color-mix(in srgb,var(--up) 62%,var(--surface2))} .sw.f1{background:var(--pr)} .sw.f2{background:var(--down)}
.fd{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:6px}
.frow{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.frow:first-of-type{border-top:0}
.frow span:last-child{font:12.5px var(--f-mono);color:var(--muted);text-align:right}
.calleg i.c0{background:var(--surface2)}.calleg i.c1{background:color-mix(in srgb,var(--accent) 30%,var(--surface2))}.calleg i.c2{background:color-mix(in srgb,var(--accent) 55%,var(--surface2))}.calleg i.c3{background:color-mix(in srgb,var(--accent) 78%,var(--surface2))}.calleg i.c4{background:var(--accent)}
.cal{touch-action:pan-y}
.cal rect.c{cursor:pointer}

/* ---------- progression engine ---------- */
function hist(id){
  const out=[];
  for(const s of S.sessions){
    const e=s.ex.find(x=>x.id===id);if(!e)continue;
    const w=e.sets.filter(x=>!x.wu&&x.r>0);
    if(w.length)out.push({t:s.t,sets:w});
  }
  return out;
}
function suggest(id,min,max,n,re){
  const x=getEx(id),h=hist(id),inc=incOf(id,re);
  if(re&&re.w0!=null&&re.since&&(!h.length||h[0].t<re.since))
    return {kind:'plan',w:re.w0,r:min,why:re.note?'Your Oct 19 plan: '+re.note:'Starting weight from your Oct 19 plan.'};
  if(!h.length)return {kind:'new',w:null,r:min,why:re&&re.note?re.note:'First time logged. Pick a weight you can move for about '+min+' '+unitWord(id)+' with 2 in reserve.'};
  const L=h[0].sets,uw=unitWord(id),lastStr=L.map(s=>fmtSet(id,s)).join(', ');
  const w=x.assist?Math.max(...L.map(s=>s.w)):Math.max(...L.map(s=>s.w));
  const at=L.filter(s=>s.w>=w-1e-6);
  let res;
  if(at.length>=n&&at.every(s=>s.r>=max)){
    if(x.assist)res={kind:'up',w:Math.max(0,snap(fromD(toD(w)-inc),id,re)),r:min,why:'Hit '+max+'+ on every set with '+fwu(w)+' of assistance. Use '+num(inc)+' '+U()+' less and restart at '+min+'.'};
    else if(w===0&&x.u!=='reps')res={kind:'rep',w:0,r:max,why:'Top of the range on every set. Add load, or extend the time.'};
    else res={kind:'up',w:snap(fromD(toD(w)+inc),id,re),r:min,why:'Last time: '+at.length+' sets of '+max+'+ at '+fwu(w)+'. Add '+num(inc)+' '+U()+' and restart at '+min+' '+uw+'.'};
  }else if(at.every(s=>s.r>=min)){
    const tr=Math.min(max,Math.min(...at.map(s=>s.r))+1);
    res={kind:'rep',w,r:tr,why:'Last time: '+lastStr+'. Same load, aim for '+tr+' '+uw+' on every set.'};
  }else{
    const p=h[1],pw=p?Math.max(...p.sets.map(s=>s.w)):null;
    const missedTwice=p&&Math.abs(pw-w)<1e-6&&p.sets.filter(s=>s.w>=pw-1e-6).some(s=>s.r<min);
    if(missedTwice&&!x.assist&&w>0)res={kind:'deload',w:snap(w*0.9,id,re),r:min,why:'Missed '+min+' '+uw+' at '+fwu(w)+' two sessions running. Drop about 10% and rebuild.'};
    else res={kind:'hold',w,r:min,why:'Fell short of '+min+' '+uw+' last time ('+lastStr+'). Hold the load and own '+min+' on every set.'};
  }
  if(!noE1(id)&&h.length>=4){const b=h.slice(0,4).map(q=>Math.max(...q.sets.map(s=>e1(s.w,s.r))));if(Math.max(b[0],b[1],b[2])<=b[3]*1.005)res.stall=true}
  return res;
}
const KIND={up:'Add weight',rep:'Add reps',hold:'Hold weight',deload:'Deload',new:'New lift',plan:'Plan'};
function tgt(id,sg){
  const x=getEx(id);
  if(x.u==='min')return sg.r+' min';
  const w=sg.w==null?'pick a load':(sg.w===0?'bodyweight':fw(sg.w)+' '+U());
  return w+' × '+sg.r+(x.u==='sec'?' sec':'');
}
function makeEx(re){
  const sg=suggest(re.id,re.min,re.max,re.sets,re);
  const sets=[];for(let i=0;i<re.sets;i++)sets.push({w:sg.w,r:sg.r,done:false,wu:false});
  const o={id:re.id,min:re.min,max:re.max,n:re.sets,sets};
  if(re.inc)o.inc=re.inc;if(re.w0!=null)o.w0=re.w0;if(re.note)o.note=re.note;if(re.since)o.since=re.since;
  return o;
}
const defRange=id=>{const x=getEx(id);return x.u==='sec'?[30,60]:x.u==='min'?[20,30]:(RANGE[x.e]||[8,12])};
const setVol=(id,s)=>{const x=getEx(id);return x.u==='reps'&&!x.assist?s.w*s.r:0};
function sessStats(s){let sets=0,vol=0;for(const e of s.ex){if(getEx(e.id).u==='min')continue;for(const x of e.sets)if(!x.wu){sets++;vol+=setVol(e.id,x)}}return {sets,vol}}

/* similar exercises: same movement first, then same muscle from another angle */
function similar(id,lim){
  const x=getEx(id),out=[];
  for(const y of allEx()){
    const yy=getEx(y.id);
    if(y.id===id||yy.u!==x.u)continue;
    const samePat=yy.pat&&yy.pat===x.pat,shared=x.p.filter(m=>yy.p.includes(m));
    if(!samePat&&!shared.length)continue;
    let sc=samePat?6:2,why;
    if(shared.length&&yy.p[0]===x.p[0])sc+=2;
    if(yy.e===x.e)sc+=1;
    sc+=x.s.filter(m=>yy.s.includes(m)).length*0.5;
    why=samePat?'Same movement · '+yy.e:'Works '+shared.join(' and ').toLowerCase()+' from a different angle · '+yy.e;
    out.push({x:yy,sc,why});
  }
  return out.sort((a,b)=>b.sc-a.sc).slice(0,lim||6);
}

/* ---------- muscle aggregation ---------- */
function muscleAgg(items){
  const M={};MUSCLES.forEach(m=>{M[m.k]={d:Array(7).fill(0),i:Array(7).fill(0),dir:0,ind:0,times:0,ex:{}}});
  items.forEach(it=>{
    const seen={};
    it.ex.forEach(e=>{
      if(!e.n)return;const x=getEx(e.id);
      x.p.forEach(m=>{const a=M[m];if(!a)return;a.dir+=e.n;if(it.day>=0)a.d[it.day]+=e.n;a.ex[e.id]=(a.ex[e.id]||0)+e.n;seen[m]=1});
      x.s.forEach(m=>{const a=M[m];if(!a)return;a.ind+=e.n;if(it.day>=0)a.i[it.day]+=e.n});
    });
    Object.keys(seen).forEach(m=>{M[m].times++});
  });
  return M;
}

const countSets=items=>items.reduce((a,it)=>a+it.ex.reduce((b,e)=>b+(getEx(e.id).u==='min'?0:e.n),0),0);

function pickToday(){
  const R=S.app.routines;if(!R.length)return null;
  const now=Date.now(),ws=weekStart(now),t0=new Date(now).setHours(0,0,0,0),ti=dayIdx(now);
  const doneToday=r=>S.sessions.some(s=>s.routineId===r.id&&s.t>=t0);
  const doneWeek=r=>S.sessions.some(s=>s.routineId===r.id&&s.t>=ws);
  const td=R.find(r=>r.day===ti&&!doneToday(r));
  if(td)return {r:td,label:'Today'};
  const left=R.filter(r=>!doneWeek(r)).sort((a,b)=>(((a.day==null?9:a.day)-ti+7)%7)-(((b.day==null?9:b.day)-ti+7)%7));
  if(left.length)return {r:left[0],label:'Up next'};
  const last=id=>{const s=S.sessions.find(x=>x.routineId===id);return s?s.t:0};
  return {r:R.slice().sort((a,b)=>last(a.id)-last(b.id))[0],label:'Up next'};
}

const HALF_LIFE=36, FRESH=1.5, HARD=4;
function fatigue(off){
  const now=Date.now()+(off||0)*36e5,F={};
  MUSCLES.forEach(m=>{F[m.k]={load:0,dir:0,ind:0,last:0,ex:{}}});
  const feed=(t,exs)=>{
    const hrs=Math.max(0,(now-t)/36e5);if(hrs>14*24)return;
    const dec=Math.pow(0.5,hrs/HALF_LIFE);
    exs.forEach(e=>{
      const x=getEx(e.id);if(!e.n||x.u==='min')return;
      x.p.forEach(m=>{const f=F[m];if(!f)return;f.load+=e.n*dec;if(hrs<=7*24){f.dir+=e.n;f.ex[e.id]=(f.ex[e.id]||0)+e.n}f.last=Math.max(f.last,t)});
      x.s.forEach(m=>{const f=F[m];if(!f)return;f.load+=e.n*0.5*dec;if(hrs<=7*24)f.ind+=e.n;f.last=Math.max(f.last,t)});
    });
  };
  S.sessions.forEach(s=>feed(s.t,s.ex.map(e=>({id:e.id,n:e.sets.filter(x=>!x.wu).length}))));
  if(S.draft)feed(S.draft.t,S.draft.ex.map(e=>({id:e.id,n:e.sets.filter(x=>x.done&&!x.wu).length})));
  MUSCLES.forEach(m=>{
    const f=F[m.k];
    f.lvl=f.last===0||f.load<0.05?'fn':f.load<FRESH?'f0':f.load<HARD?'f1':'f2';
    f.label={fn:'Not trained lately',f0:'Recovered',f1:'Recovering',f2:'Fatigued'}[f.lvl];
    f.hrs=f.load>FRESH?HALF_LIFE*Math.log2(f.load/FRESH):0;
  });
  return F;
}

function prList(){
  const ex={};

    const w=e.sets.filter(x=>!x.wu&&x.r>0&&x.w>0);if(!w.length)return;
    const best=Math.max(...w.map(x=>e1(x.w,x.r)));
    (ex[e.id]=ex[e.id]||[]).push({t:s.t,v:best});
  }));
  const out=[];
  Object.keys(ex).forEach(id=>{let b=0;ex[id].forEach((p,i)=>{if(i>0&&p.v>b*1.001)out.push({id,t:p.t,v:p.v});b=Math.max(b,p.v)})});

}
function strengthIdx(ws0,N){
  const base={};
  S.sessions.slice().sort((a,b)=>a.t-b.t).forEach(s=>s.ex.forEach(e=>{
    if(base[e.id]!=null||noE1(e.id))return;
    const w=e.sets.filter(x=>!x.wu&&x.r>0&&x.w>0);
    if(w.length)base[e.id]=Math.max(...w.map(x=>e1(x.w,x.r)));
  }));
  const pts=[];
  for(let i=0;i<N;i++){
    const a=ws0+i*7*864e5,b=a+7*864e5,r=[];
    const best={};
    S.sessions.filter(s=>s.t>=a&&s.t<b).forEach(s=>s.ex.forEach(e=>{
      if(!base[e.id])return;
      const w=e.sets.filter(x=>!x.wu&&x.r>0&&x.w>0);if(!w.length)return;
      best[e.id]=Math.max(best[e.id]||0,...w.map(x=>e1(x.w,x.r)));
    }));
    Object.keys(best).forEach(id=>r.push(best[id]/base[id]*100));

function niceTicks(lo,hi){
  let rng=hi-lo;if(rng<=0){lo-=1;hi+=1;rng=2}
  const raw=rng/4,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const st=[1,2,2.5,5,10].find(m=>m*mag>=raw)*mag;
  const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];
  for(let v=a;v<=b+st/2;v+=st)t.push(Math.round(v*1000)/1000);
  return t;
}
function lineChart(key,pts,fmt,desc){

  const Y=v=>pt+(1-(v-ymin)/(ymax-ymin))*(H-pt-pb);
  const pos=pts.map(p=>({x:X(p.t),y:Y(p.y),t:p.t,v:p.y,pr:p.pr}));

  if(pos.length>1)s+=`<polyline class="ln" points="${pos.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}"/>`;

}
function barChart(vals,labels,desc){
  const W=340,H=150,pl=8,pr=8,pt=18,pb=22,n=vals.length,mx=Math.max(1,...vals),gap=8,bw=(W-pl-pr-gap*(n-1))/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}"><line class="grid" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>`;
  vals.forEach((v,i)=>{
    const h=(H-pt-pb)*v/mx,x=pl+i*(bw+gap),y=H-pb-h;
    if(v>0)s+=`<path class="bar ${i===n-1?'cur':''}" d="M${x.toFixed(1)} ${(H-pb).toFixed(1)}V${(y+4).toFixed(1)}a4 4 0 0 1 4-4h${(bw-8).toFixed(1)}a4 4 0 0 1 4 4V${(H-pb).toFixed(1)}z"/><text class="ax" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${v>=1000?num(v/1000)+'k':Math.round(v)}</text>`;
    s+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${labels[i]}</text>`;
  });
  return s+'</svg>';
}
function exSeries(id,metric){
  const out=[];let best=0;
  hist(id).slice().reverse().forEach(h=>{
    const top=Math.max(...h.sets.map(x=>x.w)),e=Math.max(...h.sets.map(x=>e1(x.w,x.r))),vol=h.sets.reduce((a,x)=>a+setVol(id,x),0),reps=Math.max(...h.sets.map(x=>x.r));
    const y=metric==='top'?top:metric==='vol'?vol:metric==='reps'?reps:e;
    out.push({t:h.t,y,pr:out.length>0&&y>best+1e-6});
    best=Math.max(best,y);
  });
  return out;
}

function finishSheet(){
  const d=S.draft;
  const done=d.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.done&&s.r>0&&s.w!=null)})).filter(e=>e.sets.length);
  let sets=0,vol=0;const prs=[];
  done.forEach(e=>{
    const x=getEx(e.id),wk=e.sets.filter(s=>!s.wu);
    if(x.u!=='min')wk.forEach(s=>{sets++;vol+=setVol(e.id,s)});
    if(!wk.length||x.u==='min')return;
    const pr=hist(e.id);if(!pr.length)return;
    const curW=Math.max(...wk.map(s=>s.w)),curE=Math.max(...wk.map(s=>e1(s.w,s.r))),curR=Math.max(...wk.map(s=>s.r));
    const pw=Math.max(...pr.flatMap(p=>p.sets.map(s=>s.w))),pe=Math.max(...pr.flatMap(p=>p.sets.map(s=>e1(s.w,s.r)))),prr=Math.max(...pr.flatMap(p=>p.sets.map(s=>s.r)));
    if(x.assist){const pl=Math.min(...pr.flatMap(p=>p.sets.map(s=>s.w)));if(Math.min(...wk.map(s=>s.w))<pl-1e-6)prs.push([x.n,'Least assistance yet: '+fwu(Math.min(...wk.map(s=>s.w)))])}
    else if(x.u==='sec'||pw===0&&curW===0){if(curW>pw+1e-6)prs.push([x.n,'Heaviest: '+fwu(curW)]);else if(curR>prr)prs.push([x.n,'Longest or most: '+curR+(x.u==='sec'?' sec':' reps')])}
    else if(curW>pw+1e-6)prs.push([x.n,'Heaviest set: '+fwu(curW)+' × '+wk.find(s=>s.w===curW).r]);
    else if(curE>pe*1.001)prs.push([x.n,'Estimated 1RM: '+fw(curE)+' '+U()]);
  });
  const dur=(Date.now()-d.t)/1000;
  showSheet(`<h2 style="margin-bottom:4px">Finish workout</h2><small>${esc(d.name)}</small>
  <div class="sumgrid"><div><small>Time</small><b>${hms(dur)}</b></div><div><small>Sets</small><b>${sets}</b></div><div><small>${U()} lifted</small><b>${volStr(vol)}</b></div></div>

}

}
function clearDemo(){
  S.sessions.filter(s=>s.demo).forEach(s=>Store.delSession(s.id));
  S.sessions=S.sessions.filter(s=>!s.demo);S.app.body=S.app.body.filter(b=>!b.demo);S.app.demo=false;
  Store.saveApp();closeSheet();render();toast('Example history removed');
}

document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=S.draft;
  const xi=b.closest('.xc')?+b.closest('.xc').dataset.i:-1,si=b.closest('.row')?+b.closest('.row').dataset.s:-1;
  switch(a){
    case 'tab':UI.tab=b.dataset.tab;UI.edit=null;render();break;
    case 'settings':openSettings();break;
    case 'closesheet':closeSheet();break;
    case 'restoreplan':{const have=S.app.routines.map(r=>r.id);let n=0;PLAN.forEach(p=>{if(!have.includes(p.id)){S.app.routines.push(planRoutine(p));n++}});S.app.planV='oct19';Store.saveApp();closeSheet();render();toast(n?n+' plan days restored':'All plan days are already there');break}
    case 'import':importLegend();break;
    case 'rmimport':if(confirm2('rmimp',b,'Tap again to remove'))removeImported();break;
    case 'cleardemo':clearDemo();break;
    case 'start':startWorkout(b.dataset.r);break;
    case 'startempty':startWorkout(null);break;
    case 'musmode':UI.mus.mode=b.dataset.m;render();break;
    case 'dview':UI.mus.view=b.dataset.v;render();break;
    case 'drange':UI.dash.weeks=+b.dataset.w;render();break;
    case 'dmetric':UI.dash.metric=b.dataset.m;render();break;
    case 'fatoff':UI.fat.off=+b.dataset.h;render();break;
    case 'fatsel':UI.fat.sel=b.dataset.mu;render();break;
    case 'cal':{const o=$('#calv');if(o)o.textContent=b.dataset.k;break}
    case 'rest':if(UI.restEnd>Date.now()){UI.restEnd=0}else{const o=[60,90,120,180],i=o.indexOf(S.app.rest);S.app.rest=o[(i+1)%o.length];Store.saveApp()}$('#rest').textContent=restLabel();$('#rest').classList.toggle('on',UI.restEnd>Date.now());break;
    case 'wu':{const s=d.ex[xi].sets[si];s.wu=!s.wu;touch();render();break}
    case 'chk':{
      const e=d.ex[xi],s=e.sets[si],x=getEx(e.id);
      if(!s.done){
        const wk=e.sets.slice(0,si).filter(q=>!q.wu).length,prev=(hist(e.id)[0]||{sets:[]}).sets[wk];
        if(x.u==='min'||x.e==='bodyweight'&&s.w==null)s.w=0;
        if(s.w==null&&prev)s.w=prev.w;
        if(s.r==null&&prev)s.r=prev.r;
        if(s.w==null){toast('Enter a weight first');break}
        if(!(s.r>0)){toast('Enter the '+unitWord(e.id)+' first');break}
        s.done=true;if(x.u!=='min'){UI.restEnd=Date.now()+S.app.rest*1000;UI.restDone=false}
      }else s.done=false;
      touch();render();break}
    case 'addset':{const e=d.ex[xi],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:null,r:l?l.r:e.min,done:false,wu:false});touch();render();break}
    case 'rmset':{const e=d.ex[xi];if(e.sets.length>1){e.sets.pop();touch();render()}break}
    case 'rmx':{if(confirm2('rmx'+xi,b,'Tap again to drop')){d.ex.splice(xi,1);touch();render()}break}
    case 'swap':{if(d.ex[xi].sets.some(s=>s.done)){toast('Uncheck the finished sets before swapping');break}openSwap({kind:'workout',i:xi});break}
    case 'edswap':openSwap({kind:'edit',i:+b.closest('.er').dataset.i});break;
    case 'doswap':doSwap(b.dataset.id);break;
    case 'swapall':openPicker(id=>doSwap(id));break;
    case 'apply':{const e=d.ex[xi],sg=suggest(e.id,e.min,e.max,e.n,e);if(sg.w!=null){e.sets.forEach(s=>{if(!s.done&&!s.wu){s.w=sg.w;s.r=sg.r}});touch();render();toast('Targets applied')}break}
    case 'addx':openPicker(id=>{const r=defRange(id);d.ex.push(makeEx({id,sets:3,min:r[0],max:r[1]}));touch();closeSheet();render()});break;
    case 'discard':if(confirm2('discard',b,'Tap again to discard')){S.draft=null;Store.saveDraft(true);UI.restEnd=0;render()}break;
    case 'finish':finishSheet();break;
    case 'finishsave':{
      const ex=d.ex.map(e=>({id:e.id,sets:e.sets.filter(s=>s.done&&s.r>0&&s.w!=null).map(s=>({w:s.w,r:s.r,wu:!!s.wu}))})).filter(e=>e.sets.length);
      const s={id:d.id,t:d.t,dur:Math.round((Date.now()-d.t)/1000),name:d.name||'Workout',routineId:d.routineId,ex};
      S.sessions.push(s);sortS();Store.saveSession(s);
      S.draft=null;Store.saveDraft(true);UI.restEnd=0;closeSheet();UI.tab='train';render();toast('Workout saved');break}
    case 'delses':if(confirm2('del'+b.dataset.id,b,'Tap again to delete')){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);Store.delSession(b.dataset.id);render()}break;
    case 'metric':UI.prog.metric=b.dataset.m;render();break;
    case 'bwadd':{const v=parseFloat(String($('#bwv').value).replace(',','.'));if(!(v>0)){toast('Enter your weight first');break}S.app.body.push({t:Date.now(),kg:fromD(v)});S.app.body.sort((x,y)=>x.t-y.t);if(S.app.body.length>600)S.app.body.splice(0,S.app.body.length-600);Store.saveApp();render();toast('Weight logged');break}
    case 'pkg':UI.pk.g=b.dataset.g;document.querySelectorAll('#pkchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.g===UI.pk.g)));$('#pklist').innerHTML=pickerHtml();break;
    case 'pick':{const cb=UI.pk.cb;if(cb)cb(b.dataset.id);break}
    case 'cxcreate':{
      const n=$('#cxn').value.trim();if(!n){toast('Name the exercise first');break}
      const mu=$('#cxm').value;
      const x={id:'c-'+uid(),n,e:$('#cxe').value,p:[mu],s:[],pat:'custom-'+mu,u:'reps',g:GRP[mu],custom:true};
      S.app.custom.push(x);Store.saveApp();const cb=UI.pk.cb;if(cb)cb(x.id);break}
    case 'newr':UI.edit={id:null,name:'',day:null,ex:[]};render();break;
    case 'editr':{const r=S.app.routines.find(x=>x.id===b.dataset.r);UI.edit=clean({id:r.id,name:r.name,day:r.day==null?null:r.day,ex:r.ex});render();break}
    case 'edcancel':UI.edit=null;render();break;
    case 'edadd':openPicker(id=>{const r=defRange(id);UI.edit.ex.push({id,sets:3,min:r[0],max:r[1]});closeSheet();render()});break;
    case 'edup':{const i=+b.closest('.er').dataset.i,L=UI.edit.ex;if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]];render()}break}
    case 'eddn':{const i=+b.closest('.er').dataset.i,L=UI.edit.ex;if(i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];render()}break}
    case 'edrm':UI.edit.ex.splice(+b.closest('.er').dataset.i,1);render();break;
    case 'edsave':{
      const e=UI.edit;if(!e.name.trim()){toast('Give the routine a name');break}
      if(!e.ex.length){toast('Add at least one exercise');break}
      e.ex.forEach(r=>{r.min=Math.max(1,r.min|0);r.max=Math.max(r.min,r.max|0)});
      if(e.id){const r=S.app.routines.find(x=>x.id===e.id);r.name=e.name.trim();r.day=e.day;r.ex=e.ex}
      else S.app.routines.push({id:uid(),name:e.name.trim(),day:e.day,ex:e.ex});
      Store.saveApp();UI.edit=null;render();toast('Routine saved');break}
    case 'eddel':if(confirm2('eddel',b,'Tap again to delete')){S.app.routines=S.app.routines.filter(r=>r.id!==UI.edit.id);Store.saveApp();UI.edit=null;render()}break;
    case 'unit':S.app.unit=b.dataset.u;Store.saveApp();openSettings();render();break;
    case 'restset':S.app.rest=+b.dataset.v;Store.saveApp();openSettings();if(S.draft&&UI.tab==='train'){$('#rest').textContent=restLabel()}break;
    case 'export':{
      const data=JSON.stringify({exportedAt:new Date().toISOString(),units:U(),weightsStoredIn:'kg',app:S.app,sessions:S.sessions},null,1);
      const r=await saveFile('overload-log-'+new Date().toISOString().slice(0,10)+'.json',data,'application/json');
      if(r==='ok'){S.app.lastBackup=Date.now();Store.saveApp();toast('Backup saved');if(UI.tab==='train')render()}else if(r==='fail')toast('Could not export a backup');
      break}
    case 'exportx':{
      try{
        const r=await saveFile('overload-log-'+new Date().toISOString().slice(0,10)+'.xlsx',buildXlsx(),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        if(r==='ok'){S.app.lastBackup=Date.now();Store.saveApp();toast('Excel saved');if(UI.tab==='train')render()}else if(r==='fail')toast('Could not export Excel');
      }catch(e){console.warn(e);toast('Could not export Excel')}
      break}
    case 'restore':{const f=$('#restorefile');if(f)f.click();break}
    case 'erase':if(confirm2('erase',b,'Tap again to erase everything')){
      S.sessions.forEach(s=>Store.delSession(s.id));S.sessions=[];S.draft=null;Store.saveDraft(true);
      S.app={unit:S.app.unit,rest:S.app.rest,routines:[],custom:[],body:[],demo:false,planV:'oct19'};Store.saveApp();closeSheet();render();toast('All data erased')}
      break;
  }
});

function onField(ev){
  const t=ev.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='w'||f==='r'){
    const xc=t.closest('.xc'),row=t.closest('.row');if(!S.draft||!xc||!row)return;
    const s=S.draft.ex[+xc.dataset.i].sets[+row.dataset.s],v=parseFloat(String(t.value).replace(',','.'));
    if(f==='w')s.w=isNaN(v)?null:Math.max(0,fromD(v));else s.r=isNaN(v)?null:Math.max(0,Math.round(v));
    touch();
  }else if(f==='wname'&&S.draft){S.draft.name=t.value;touch()}
  else if(f==='exsel'){UI.prog.ex=t.value;render()}
  else if(f==='pk-q'){UI.pk.q=t.value;$('#pklist').innerHTML=pickerHtml()}
  else if(f==='ed-name'){UI.edit.name=t.value}
  else if(f==='ed-day'){UI.edit.day=t.value===''?null:+t.value}
  else if(UI.edit&&t.closest('.er')){
    const r=UI.edit.ex[+t.closest('.er').dataset.i],v=parseInt(t.value,10);
    if(f==='ed-sets')r.sets=v||3;else if(f==='ed-min')r.min=v||1;else if(f==='ed-max')r.max=v||1;
  }
}
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if((ev.key==='Enter'||ev.key===' ')&&t&&t.classList&&t.classList.contains('bm')){ev.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}

function chartPick(ev){
  const box=ev.target.closest&&ev.target.closest('[data-chart]');if(!box)return;
  const key=box.dataset.chart,c=CH[key];if(!c)return;
  const svg=box.querySelector('svg'),r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const x=(ev.clientX-r.left)/r.width*vb.width;
  let best=c.pos[0];c.pos.forEach(p=>{if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p});
  const hi=$('#hi-'+key);hi.setAttribute('cx',best.x);hi.setAttribute('cy',best.y);
  $('#cv-'+key).innerHTML=D(best.t)+' · <b>'+esc(c.fmt(best.v))+'</b>'+(best.pr?' · record':'');
}
document.addEventListener('pointermove',ev=>{if(ev.pointerType==='mouse'||ev.buttons)chartPick(ev)});

/* ---------- standalone extras: files, Excel, restore, persistence ---------- */
async function saveFile(name,data,mime){
  try{
    if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});return 'ok'}}
  }catch(e){if(e&&e.code==='declined')return 'declined'}
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime}),f=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:name});return 'ok'}catch(e){if(e&&e.name==='AbortError')return 'declined'}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return 'ok';
  }catch(e){return 'fail'}
}
function buildXlsx(){
  if(typeof XLSX==='undefined')throw new Error('xlsx missing');
  const u=U(),wb=XLSX.utils.book_new(),ss=S.sessions.slice().sort((a,b)=>a.t-b.t);
  const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const rows=[['Date','Workout','Exercise','Set','Weight ('+u+')','Reps / seconds / minutes','Warm-up','Est. 1RM ('+u+')']];
  ss.forEach(s=>s.ex.forEach(e=>{const x=getEx(e.id);e.sets.forEach((st,i)=>rows.push([iso(s.t),s.name,x.n,i+1,Math.round(toD(st.w)*10)/10,st.r,st.wu?'yes':'',noE1(e.id)||st.wu||!(st.w>0)?'':Math.round(toD(e1(st.w,st.r))*10)/10]))}));
  const add=(n,r,w)=>{const ws=XLSX.utils.aoa_to_sheet(r);ws['!cols']=(w||[]).map(c=>({wch:c}));XLSX.utils.book_append_sheet(wb,ws,n)};
  add('Sets',rows,[12,22,30,6,12,22,9,14]);
  const wk={};
  ss.forEach(s=>{const k=weekStart(s.t);const o=wk[k]=wk[k]||{n:0,sets:0,vol:0};const a=sessStats(s);o.n++;o.sets+=a.sets;o.vol+=a.vol});
  const wr=[['Week starting','Sessions','Hard sets','Volume ('+u+')']];
  Object.keys(wk).sort().forEach(k=>wr.push([iso(+k),wk[k].n,wk[k].sets,Math.round(toD(wk[k].vol))]));
  add('Weekly summary',wr,[14,10,10,14]);
  const mr=[['Week starting'].concat(MUSCLES.map(m=>m.k+' (direct sets)'))];
  Object.keys(wk).sort().forEach(k=>{const A=muscleAgg(weekItems(+k));mr.push([iso(+k)].concat(MUSCLES.map(m=>A[m.k].dir)))});
  add('Muscle sets by week',mr,[14].concat(MUSCLES.map(()=>14)));
  const pr=[['Date','Exercise','Est. 1RM ('+u+')']];
  prList().slice().reverse().forEach(p=>pr.push([iso(p.t),getEx(p.id).n,Math.round(toD(p.v)*10)/10]));
  add('Records',pr,[12,30,14]);
  const bw=[['Date','Body weight ('+u+')']];
  (S.app.body||[]).forEach(b=>bw.push([iso(b.t),Math.round(toD(b.kg)*10)/10]));
  add('Body weight',bw,[12,18]);
  return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function restoreFile(ev){
  const f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!j||!Array.isArray(j.sessions))throw 0;
    const have=new Set(S.sessions.map(s=>s.id));let add=0;
    j.sessions.forEach(s=>{if(s&&s.id&&Array.isArray(s.ex)&&!have.has(s.id)){S.sessions.push(s);Store.saveSession(s);add++}});
    sortS();
    if(j.app){
      if(!S.app.routines.length&&j.app.routines)S.app.routines=j.app.routines;
      const ids=new Set((S.app.custom||[]).map(c=>c.id));(j.app.custom||[]).forEach(c=>{if(!ids.has(c.id))S.app.custom.push(c)});
      const bt=new Set((S.app.body||[]).map(b=>b.t));(j.app.body||[]).forEach(b=>{if(!bt.has(b.t))S.app.body.push(b)});S.app.body.sort((a,b)=>a.t-b.t);
    }
    Store.saveApp();closeSheet();render();toast(add?'Restored '+add+' sessions':'Nothing new in that backup');
  }catch(e){toast('That is not an Overload Log backup')}
}
if('storage' in navigator&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

Store.connect().then(()=>{if(ensurePlan())Store.saveApp();Store.saveLocal();render()});
})();
